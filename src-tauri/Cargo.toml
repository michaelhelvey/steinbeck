[package]
name = "steinbeck"
version = "0.1.0"
description = "A calm markdown writing app"
authors = ["Michael Helvey"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "steinbeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-log = "2"
harper-core = { version = "3.2.0", default-features = false, features = ["concurrent"] }
pulldown-cmark = { version = "0.13", default-features = false }

[profile.dev.package.harper-core]
opt-level = 3

[profile.dev.package.harper-brill]
opt-level = 3

[profile.dev.package.harper-pos-utils]
opt-level = 3

[profile.dev.package.fst]
opt-level = 3
